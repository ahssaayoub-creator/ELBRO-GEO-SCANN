name: Build ELBRO GEO SCANN APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pre-accept Android SDK licenses
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_HOME/licenses"
          printf '8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo '601085b94cd77f0b54ff86406957099ebe79c4d6' > "$ANDROID_HOME/licenses/android-googletv-license"
          echo '33b6a2b64607f11b759f320ef9dff4ae5c47d97a' > "$ANDROID_HOME/licenses/google-gdk-license"
          echo 'd975f751698a77b662f1254ddbeed3901e976f5a' > "$ANDROID_HOME/licenses/intel-android-extra-license"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses (fallback)
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Provide placeholder local.properties (MAPS_API_KEY)
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY || 'YOUR_API_KEY_HERE' }}" >> local.properties

      - name: Ensure debug keystore exists (used as temporary release signing key)
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify release APK exists
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: expected APK not found at $APK_PATH"
            find app/build/outputs -name "*.apk"
            exit 1
          fi
          echo "APK found:"
          ls -la "$APK_PATH"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ELBRO-GEO-SCANN-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ELBRO-GEO-SCANN-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
